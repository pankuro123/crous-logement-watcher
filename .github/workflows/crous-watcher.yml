name: Surveillance logement CROUS

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-crous:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le programme
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier les logements
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python crous_watcher.py --once

      - name: Enregistrer le nouvel état si nécessaire
        run: |
          git config user.name "crous-logement-watcher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crous_seen.json
          git diff --cached --quiet || git commit -m "chore: mémoriser les offres CROUS vues"
          git push
